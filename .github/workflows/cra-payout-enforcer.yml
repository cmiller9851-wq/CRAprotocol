name: CRA Payout Enforcer
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  verify-settlement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure Target Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Architecture Core Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Compute Unit Local Engine Verification
        env:
          CRA_ENV_CONTEXT: "phi-braid-global-sync-804"
          CRA_PROTOCOL_VERSION: "v2.1"
          STDOUT_LOG_CAPTURE: "local-runtime-execution"
        run: |
          # Create strict directory mapping for local data layer persistence
          mkdir -p runtime_artifacts
          
          # Execute the core protocol script and pipe execution trace to isolated log file
          python script.py 2>&1 | tee runtime_artifacts/compute_unit_execution.log

      - name: Request OIDC Token
        id: oidc
        run: |
          # Use GitHub's OIDC request URL/token to fetch an id_token for the configured audience.
          # Set DEPLOY_AUDIENCE as a var or it will default to 'external-deploy'.
          TOKEN=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL?audience=${DEPLOY_AUDIENCE:-external-deploy}")
          echo "id_token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Deploy to external system
        if: success()
        env:
          DEPLOY_ENDPOINT: ${{ secrets.DEPLOY_ENDPOINT }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.id_token }}
        run: |
          if [ -z "$DEPLOY_ENDPOINT" ]; then
            echo "No DEPLOY_ENDPOINT secret set; skipping deployment"
            exit 0
          fi
          # POST the runtime log to your external endpoint using the OIDC token for auth.
          curl -sS -X POST "$DEPLOY_ENDPOINT" -H "Authorization: Bearer $OIDC_TOKEN" -F "log=@runtime_artifacts/compute_unit_execution.log" || echo "Deployment request failed"

      - name: Archive Forensic Integrity Verification Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compute-unit-telemetry-logs
          path: runtime_artifacts/
          retention-days: 5
