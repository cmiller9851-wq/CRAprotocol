name: PATRIOT_v2.0 Local Manifest Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CRAprotocol
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run local manifest generation cycle
        run: python3 scripts/patriot_v2.0_sovereign_master.py full

      - name: Confirm generated artifacts are local only
        run: test -s garrison_sovereign/colossus_5m_funding_wave/colossus_5m_funding_wave_manifest.json
