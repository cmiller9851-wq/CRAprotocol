name: CRA Read-Only Rail Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-settlement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate local rail metadata
        run: |
          python scripts/verify_rail.py --artifact 192 --primary 1391
          echo "Read-only validation complete; no payment or settlement action was performed."
