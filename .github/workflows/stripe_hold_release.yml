name: Stripe Account Verification (Read Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stripe-account-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Verify configured read-only credentials
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          STRIPE_ACCOUNT_ID: ${{ secrets.STRIPE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p .github/workflows/artifacts
          if [[ -z "${STRIPE_API_KEY:-}" || -z "${STRIPE_ACCOUNT_ID:-}" ]]; then
            printf '%s\n' '{"status":"NOT_CONFIGURED","writes_performed":false}' \
              > .github/workflows/artifacts/stripe_compliance_report.json
            echo 'Stripe read-only verification skipped: required repository secrets are not configured.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python stripe_payout_hold_release.py
          test -s /tmp/stripe_compliance_report.json
          cp /tmp/stripe_compliance_report.json .github/workflows/artifacts/stripe_compliance_report.json

      - name: Upload compliance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stripe-compliance-report
          path: .github/workflows/artifacts/stripe_compliance_report.json
          if-no-files-found: warn
          retention-days: 90

      - name: Workflow summary
        if: always()
        run: |
          {
            echo '## Stripe Account Verification (Read Only)'
            echo ''
            echo 'No payout hold release, charge, transfer, or settlement write is performed by this workflow.'
            echo 'Repository-generated status is not proof of a Stripe settlement.'
          } >> "$GITHUB_STEP_SUMMARY"
