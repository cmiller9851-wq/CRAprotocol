name: Stripe Account Verification

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  stripe-account-verification:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Query Stripe Account State
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          STRIPE_ACCOUNT_ID: ${{ secrets.STRIPE_ACCOUNT_ID }}
        run: |
          python stripe_payout_hold_release.py

      - name: Create Compliance Report Artifact
        if: always()
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          STRIPE_ACCOUNT_ID: ${{ secrets.STRIPE_ACCOUNT_ID }}
        run: |
          mkdir -p .github/workflows/artifacts
          python stripe_payout_hold_release.py
          if [ -f /tmp/stripe_compliance_report.json ]; then
            cp /tmp/stripe_compliance_report.json \
              .github/workflows/artifacts/stripe_compliance_report.json
          fi

      - name: Upload Compliance Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stripe-compliance-report
          path: .github/workflows/artifacts/stripe_compliance_report.json
          if-no-files-found: warn
          retention-days: 90

      - name: Workflow Summary
        if: always()
        run: |
          echo "## Stripe Account Verification" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Stripe account restrictions were queried directly." >> "$GITHUB_STEP_SUMMARY"
          echo "Stripe balance and payout state were queried directly." >> "$GITHUB_STEP_SUMMARY"
          echo "Actual Stripe PaymentIntents and charges were queried directly." >> "$GITHUB_STEP_SUMMARY"
          echo "Local settlement ledger was reported separately from Stripe settlement data." >> "$GITHUB_STEP_SUMMARY"
          echo "Repository-generated status is not treated as proof of Stripe settlement." >> "$GITHUB_STEP_SUMMARY"
          echo "No KYB documents were submitted by this workflow." >> "$GITHUB_STEP_SUMMARY"
          echo "No payout hold release was requested by this workflow." >> "$GITHUB_STEP_SUMMARY"
