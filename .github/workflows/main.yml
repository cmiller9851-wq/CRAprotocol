name: CRA Protocol Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip pandas numpy

      - name: Validate supported manifests
        run: python scripts/validate_json_whitelist.py

      - name: Compile core modules
        run: |
          python -m py_compile \
            executive_override.py \
            observability_exporter.py \
            dqfr_calculator/compute.py \
            dqfr_sovereign_audit.py \
            src/dqfr/metrics.py

      - name: Run deterministic DQFR check
        run: |
          python - <<'PY'
          import pandas as pd
          from dqfr_calculator.compute import dqfr_score
          frame = pd.read_csv('tests/fixtures/dqfr_train.csv')
          score = dqfr_score(frame, {'missing_rate': 0.02, 'bias_threshold': 0.05})
          print(f'DQFR score: {score:.3f}')
          assert score >= 0.95
          PY
