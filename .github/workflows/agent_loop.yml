name: Autonomous AI Playground Preflight

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile and run deterministic evaluator preflight
        run: |
          python -m py_compile src/ai_agent.py sIc/state_evaluator.py
          python sIc/state_evaluator.py
