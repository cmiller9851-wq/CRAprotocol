name: CRA Runtime CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-asyncio fastapi httpx uvicorn cryptography "web3>=7" "eth-abi>=5"

      - name: Run module test suites
        run: |
          PYTHONPATH=. pytest \
            tests/modules/test_stream_inspector.py \
            tests/modules/test_payments.py \
            tests/test_suite_comprehensive.py \
            tests/modules/test_supervisor.py \
            tests/modules/test_mapbox_matrix.py \
            tests/modules/test_congestion_rerouting.py \
            tests/modules/test_service.py \
            tests/modules/test_x402_middleware.py \
            --asyncio-mode=auto -v -W ignore

      - name: Kernel self-test (legacy)
        run: python -m unittest test_cra_kernel.py -v
        continue-on-error: true
