name: CRA Kernel CI

on:
  push:
    branches: [main, cra-kernel-hardened, 'ci/**']
  pull_request:
    branches: [main, cra-kernel-hardened]

jobs:
  test-kernel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pandas

      - name: Run unit tests
        run: python -m unittest test_cra_kernel.py -v

      - name: Run pytest suite
        run: python -m pytest -q --ignore=tests/proposition_preservation_test.py

      - name: Execute kernel verification output
        run: python cra_mathematical_kernel.py
