apiVersion: v1
kind: Namespace
metadata:
  name: cra-staging
  labels:
    environment: staging
    app.kubernetes.io/part-of: craprotocol
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cra-supervisor-config
  namespace: cra-staging
data:
  HEARTBEAT_INTERVAL: "0.5"
  RETRY_MAX_ATTEMPTS: "5"
  RETRY_BASE_BACKOFF: "0.25"
  LOG_LEVEL: "INFO"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cra-supervisor-runtime
  namespace: cra-staging
  labels:
    app: cra-supervisor-runtime
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cra-supervisor-runtime
  template:
    metadata:
      labels:
        app: cra-supervisor-runtime
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: runtime
          # Build and push your image:
          #   docker build -t ghcr.io/cmiller9851-wq/cra-supervisor:staging -f deploy/Dockerfile .
          image: ghcr.io/cmiller9851-wq/cra-supervisor:staging
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: cra-supervisor-config
          env:
            - name: MAPBOX_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cra-secrets
                  key: MAPBOX_ACCESS_TOKEN
                  optional: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: cra-supervisor-runtime
  namespace: cra-staging
  labels:
    app: cra-supervisor-runtime
spec:
  type: ClusterIP   # use LoadBalancer if your staging cluster provides external IPs
  selector:
    app: cra-supervisor-runtime
  ports:
    - name: http
      port: 80
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cra-supervisor-hpa
  namespace: cra-staging
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cra-supervisor-runtime
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
