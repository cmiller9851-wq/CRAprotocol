# Local Kubernetes deployment for minikube / kind / Docker Desktop
# Usage:
#   docker build -t cra-supervisor:local -f deploy/Dockerfile .
#   kubectl apply -f deploy/k8s/local.yaml
#   kubectl -n cra-local port-forward svc/cra-runtime 8000:8000
apiVersion: v1
kind: Namespace
metadata:
  name: cra-local
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cra-local-config
  namespace: cra-local
data:
  HEARTBEAT_INTERVAL: "0.5"
  RETRY_MAX_ATTEMPTS: "5"
  RETRY_BASE_BACKOFF: "0.25"
  LOG_LEVEL: "INFO"
  # Settlement routing — verified primary wallet (cmillerr.cb.id / swervincurvin.base.eth)
  X402_RECIPIENT: "0x421949B526e7e215a64E88E6F4cEE6ABd10a2500"
  SWEEP_DESTINATION: "cmillerr.cb.id"
  SWEEP_THRESHOLD_USDC: "5.0"
  SWEEP_COOLDOWN_SECONDS: "1800"
  SWEEP_LIVE: "0"
  X402_PRICE_USDC: "0.01"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cra-runtime
  namespace: cra-local
  labels:
    app: cra-runtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cra-runtime
  template:
    metadata:
      labels:
        app: cra-runtime
    spec:
      containers:
        - name: runtime
          image: cra-supervisor:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: cra-local-config
          env:
            - name: MAPBOX_ACCESS_TOKEN
              value: ""
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: cra-runtime
  namespace: cra-local
  labels:
    app: cra-runtime
spec:
  type: NodePort
  selector:
    app: cra-runtime
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30080
